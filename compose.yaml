# How the robotics server runs this site. The platform fills in ${PORT_1}
# (from robotics.yml) and ${ENVIRONMENT} (dev or live) at each release.
services:
  web:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-}
    ports:
      - "127.0.0.1:${PORT_1}:80"
    restart: unless-stopped
