server {
    listen 80;
    root /usr/share/nginx/html;

    # Behind the platform's proxy: keep redirects relative (/about -> /about/)
    # so they stay on https and on the team's own address.
    absolute_redirect off;
    server_tokens off;

    # The platform asks this before a release counts.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /404.html;
}
